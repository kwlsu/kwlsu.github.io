<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>
<title>KIWOLASU</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}
html, body{
    width:100%;
    height:100%;
}
body{
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient( circle at center, #101a29 0%, #05080e 55%, #000 100% );
    font-family:Arial,sans-serif;
    color:white;
    touch-action:none;
}
.app{
    position:relative;
    width:360px;
    height:650px;
    max-width:100vw;
    max-height:100vh;
    overflow:hidden;
}
.content{
    position:absolute;
    left:15px;
    right:15px;
    top:20px;
    min-height:220px;
    max-height:calc(100% - 40px);
    padding:25px;
    border-radius:20px;
    background: linear-gradient( 145deg, rgba(20,35,52,.97), rgba(7,13,21,.97) );
    border:1px solid rgba(80,195,255,.35);
    box-shadow: 0 0 15px rgba(60,180,255,.12), inset 0 0 20px rgba(60,180,255,.03);
    opacity:0;
    transform: translateY(-20px) scale(.97);
    pointer-events:none;
    transition: opacity .35s ease, transform .35s ease;
    overflow:auto;
    scrollbar-width:none;
}
.content::-webkit-scrollbar{
    display:none;
}
.content.show{
    opacity:1;
    transform: translateY(0) scale(1);
    pointer-events:auto;
}
.content h2{
    font-size:22px;
    margin-bottom:8px;
    color:#8de8ff;
    letter-spacing:1px;
}
.content p{
    font-size:14px;
    line-height:1.6;
    color:rgba(255,255,255,.65);
    margin-bottom:18px;
}
.close{
    position:absolute;
    right:14px;
    top:14px;
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.05);
    color:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    z-index:5;
}
.link-button{
    width:100%;
    min-height:48px;
    margin-top:8px;
    border-radius:12px;
    border:1px solid rgba(90,205,255,.4);
    background: linear-gradient( 135deg, rgba(30,65,90,.75), rgba(10,20,30,.9) );
    color:white;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:bold;
    letter-spacing:.5px;
    box-shadow: 0 0 8px rgba(60,190,255,.12);
    transition: transform .2s ease, box-shadow .2s ease;
}
.link-button:active{
    transform:scale(.97);
    box-shadow: 0 0 18px rgba(60,200,255,.35);
}
.video-container{
    width:100%;
    aspect-ratio:16 / 9;
    margin-top:10px;
    overflow:hidden;
    border-radius:12px;
    display:none;
    background:#000;
    border:1px solid rgba(80,195,255,.25);
    box-shadow: 0 0 12px rgba(50,180,255,.12);
}
.video-container iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}
.profile-badge{
    position:absolute;
    left:50%;
    top:52px;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    z-index:1;
    pointer-events:none;
    opacity:1;
    transition:opacity .3s ease, transform .3s ease;
}
.app.menu-open .profile-badge{
    opacity:0;
    transform:translateX(-50%) translateY(-10px);
}
.profile-avatar{
    position:relative;
    width:84px;
    height:84px;
    border-radius:50%;
    background: radial-gradient( circle at 35% 30%, #1c3a52, #071019 75% );
    border:2px solid rgba(90,205,255,.6);
    box-shadow: 0 0 18px rgba(60,190,255,.4), 0 0 40px rgba(60,190,255,.12), inset 0 0 14px rgba(80,195,255,.15);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:800;
    letter-spacing:1px;
    color:#8de8ff;
    text-shadow: 0 0 10px rgba(140,232,255,.8);
}
.profile-avatar::before{
    content:"";
    position:absolute;
    inset:-7px;
    border-radius:50%;
    border:1px solid rgba(80,195,255,.35);
    animation: kiwo-pulse 2.6s ease-out infinite;
}
@keyframes kiwo-pulse{
    0%{ transform:scale(.9); opacity:.85; }
    70%{ transform:scale(1.3); opacity:0; }
    100%{ opacity:0; }
}
.profile-name{
    font-size:14px;
    font-weight:700;
    letter-spacing:2.5px;
    color:white;
    text-shadow: 0 0 8px rgba(80,195,255,.4);
}
.profile-tier{
    font-size:9.5px;
    color:rgba(255,255,255,.5);
    letter-spacing:1.5px;
    text-transform:uppercase;
}
.radial{
    position:absolute;
    left:50%;
    bottom:15px;
    width:360px;
    height:360px;
    transform: translateX(-50%);
    user-select:none;
    touch-action:none;
}
.rotate-layer{
    position:absolute;
    inset:0;
    transform: translate3d(0,0,0) rotate(0deg);
    transform-origin:center;
    will-change:transform;
    transition: transform .5s cubic-bezier(.2,.85,.3,1.15);
}
.line{
    position:absolute;
    left:50%;
    top:50%;
    width:135px;
    height:1px;
    transform-origin:left center;
    background: linear-gradient( 90deg, rgba(80,205,255,.65), rgba(80,205,255,.05) );
    opacity:0;
    transition: opacity .25s ease;
    pointer-events:none;
}
.line.top{
    transform:rotate(-90deg);
}
.line.right{
    transform:rotate(0deg);
}
.line.bottom{
    transform:rotate(90deg);
}
.line.left{
    transform:rotate(180deg);
}
.radial.open .line{
    opacity:1;
}
.menu{
    position:absolute;
    left:50%;
    top:50%;
    width:68px;
    height:68px;
    margin-left:-34px;
    margin-top:-34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-decoration:none;
    font-size:10px;
    font-weight:bold;
    text-align:center;
    background: radial-gradient( circle, #172537, #0b121c 75% );
    border:1px solid rgba(80,195,255,.55);
    box-shadow: 0 0 8px rgba(50,180,255,.2);
    opacity:0;
    transform: translate(var(--x),var(--y)) scale(.25);
    transition: transform .48s cubic-bezier(.2,.9,.3,1.15), opacity .22s ease;
    will-change:transform;
    pointer-events:none;
}
.menu.top{
    --x:0px;
    --y:-135px;
}
.menu.right{
    --x:135px;
    --y:0px;
}
.menu.bottom{
    --x:0px;
    --y:135px;
}
.menu.left{
    --x:-135px;
    --y:0px;
}
.radial.open .menu{
    opacity:1;
    transform: translate(var(--x),var(--y)) scale(1);
    pointer-events:auto;
}
.menu.active{
    border-color: rgba(130,230,255,.95);
    box-shadow: 0 0 12px rgba(70,205,255,.6), 0 0 28px rgba(70,180,255,.25);
}
.menu span{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    transform: rotate( calc( -1 * var(--rotation,0deg) ) );
    pointer-events:none;
    white-space:nowrap;
}
.center{
    position:absolute;
    left:50%;
    top:50%;
    width:122px;
    height:122px;
    transform: translate3d(-50%,-50%,0);
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background: radial-gradient( circle, #172537, #0b121c 70% );
    border: 2px solid rgba(90,205,255,.65);
    color:white;
    font-size:20px;
    font-weight:bold;
    letter-spacing:2px;
    cursor:pointer;
    z-index:20;
    box-shadow: 0 0 12px rgba(60,190,255,.35), 0 0 30px rgba(60,190,255,.08);
    touch-action:manipulation;
}
.center-icon{
    width:44px;
    height:44px;
    color:#8de8ff;
    filter: drop-shadow(0 0 6px rgba(140,232,255,.75));
    transition: transform .4s cubic-bezier(.2,.85,.3,1.15), color .3s ease;
    pointer-events:none;
}
.radial.open .center-icon{
    transform: rotate(90deg);
    color:#b5f0ff;
}
.center:active{
    transform: translate3d(-50%,-50%,0) scale(.96);
}
.radial.dragging .rotate-layer{
    transition:none;
}
.radial.dragging .menu{
    transition:none;
}
@media (orientation:portrait){
    .app{
        width:min(360px,100vw);
        height:min(650px,100vh);
    }
    .radial{
        width:360px;
        height:360px;
        bottom:15px;
    }
}
@media (orientation:landscape){
    .app{
        width:100vw;
        height:100vh;
        max-width:none;
        max-height:none;
    }
    .content{
        left:20px;
        right:auto;
        top:50%;
        width:min(52vw,560px);
        max-height:90vh;
        transform: translateY(-50%) translateX(-25px) scale(.97);
    }
    .content.show{
        transform: translateY(-50%) translateX(0) scale(1);
    }
    .radial{
        left:auto;
        right:5vw;
        bottom:50%;
        width:300px;
        height:300px;
        transform: translateY(50%);
    }
    .line{
        width:110px;
    }
    .menu.top{
        --x:0px;
        --y:-110px;
    }
    .menu.right{
        --x:110px;
        --y:0px;
    }
    .menu.bottom{
        --x:0px;
        --y:110px;
    }
    .menu.left{
        --x:-110px;
        --y:0px;
    }
    .center{
        width:105px;
        height:105px;
        font-size:17px;
        letter-spacing:1.5px;
    }
}
@media (orientation:landscape) and (max-height:420px){
    .content{
        width:48vw;
        padding:18px;
        min-height:180px;
    }
    .content h2{
        font-size:19px;
    }
    .content p{
        font-size:12px;
        margin-bottom:10px;
    }
    .link-button{
        min-height:40px;
        font-size:12px;
    }
    .radial{
        right:3vw;
        width:250px;
        height:250px;
    }
    .menu{
        width:58px;
        height:58px;
        margin-left:-29px;
        margin-top:-29px;
    }
    .menu.top{
        --x:0px;
        --y:-90px;
    }
    .menu.right{
        --x:90px;
        --y:0px;
    }
    .menu.bottom{
        --x:0px;
        --y:90px;
    }
    .menu.left{
        --x:-90px;
        --y:0px;
    }
    .line{
        width:90px;
    }
    .center{
        width:88px;
        height:88px;
        font-size:14px;
    }
}
@media (orientation:landscape) and (min-width:1000px){
    .app{
        width:100vw;
        height:100vh;
    }
    .content{
        left:6vw;
        top:50%;
        width:min(520px,42vw);
        min-height:240px;
        padding:30px;
        border-radius:24px;
    }
    .content h2{
        font-size:25px;
    }
    .content p{
        font-size:15px;
    }
    .radial{
        right:9vw;
        bottom:50%;
        width:400px;
        height:400px;
        transform: translateY(50%);
    }
    .line{
        width:150px;
    }
    .menu{
        width:76px;
        height:76px;
        margin-left:-38px;
        margin-top:-38px;
        font-size:11px;
    }
    .menu.top{
        --x:0px;
        --y:-150px;
    }
    .menu.right{
        --x:150px;
        --y:0px;
    }
    .menu.bottom{
        --x:0px;
        --y:150px;
    }
    .menu.left{
        --x:-150px;
        --y:0px;
    }
    .center{
        width:130px;
        height:130px;
        font-size:21px;
        letter-spacing:2px;
    }
}
@media (orientation:landscape) and (min-width:1400px){
    .content{
        left:8vw;
        width:min(600px,40vw);
    }
    .radial{
        right:12vw;
    }
}
</style>
</head>
<body>
<div class="app">
    <div
        class="content"
        id="content"
    >
        <button
            class="close"
            id="close"
        >
            ×
        </button>
        <h2 id="contentTitle">
            KIWOLASU
        </h2>
        <p id="contentText">
            Pilih salah satu menu.
        </p>
        <div id="buttons"></div>
        <div
            class="video-container"
            id="videoContainer"
        ></div>
    </div>
    <div class="profile-badge">
        <div class="profile-avatar">KW</div>
        <div class="profile-name">KIWOLASU</div>
        <div class="profile-tier">Local Version</div>
    </div>
    <div
        class="radial"
        id="radial"
    >
        <div
            class="rotate-layer"
            id="rotateLayer"
        >
            <div class="line top"></div>
            <div class="line right"></div>
            <div class="line bottom"></div>
            <div class="line left"></div>
            <a
                href="#"
                class="menu bottom"
                data-index="0"
            >
                <span>WHATSAPP</span>
            </a>
            <a
                href="#"
                class="menu right"
                data-index="1"
            >
                <span>TELEGRAM</span>
            </a>
            <a
                href="#"
                class="menu top"
                data-index="2"
            >
                <span>DOWNLOAD</span>
            </a>
            <a
                href="#"
                class="menu left"
                data-index="3"
            >
                <span>TUTORIAL</span>
            </a>
        </div>
        <div
            class="center"
            id="center"
        >
            <svg class="center-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="1.4" opacity=".35"/>
                <circle cx="24" cy="24" r="13" stroke="currentColor" stroke-width="1.6" opacity=".6"/>
                <path d="M24 8 V16 M24 32 V40 M8 24 H16 M32 24 H40" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>
                <circle cx="24" cy="24" r="6.5" fill="currentColor"/>
            </svg>
        </div>
    </div>
</div>
<script>const FIREBASE_URL =
"https://pucuk-9d1d6-default-rtdb.asia-southeast1.firebasedatabase.app/links.json";
let menuData = {
    menu1:{
        title:"WHATSAPP",
        description:
            "Hubungi kami melalui WhatsApp.",
        url:"#"
    },
    menu2:{
        title:"TELEGRAM",
        description:
            "Bergabung melalui Telegram.",
        url:"#"
    },
    menu3:{
        title:"DOWNLOAD",
        description:
            "Download file yang tersedia.",
        url:"#"
    },
    menu4:{
        title:"TUTORIAL",
        description:
            "Panduan penggunaan KIWOLASU.",
        url:
            "https://youtu.be/iAAzIHx9esQ"
    }
};
const app =
    document.querySelector(".app");
const radial =
    document.getElementById("radial");
const center =
    document.getElementById("center");
const layer =
    document.getElementById("rotateLayer");
const content =
    document.getElementById("content");
const title =
    document.getElementById("contentTitle");
const text =
    document.getElementById("contentText");
const buttons =
    document.getElementById("buttons");
const videoContainer =
    document.getElementById("videoContainer");
const close =
    document.getElementById("close");
const menus =
    document.querySelectorAll(".menu");
async function loadFirebase(){
    try{
        const response =
            await fetch(
                FIREBASE_URL +
                "?t=" +
                Date.now()
            );
        if(!response.ok){
            throw new Error(
                "Firebase HTTP " +
                response.status
            );
        }
        const data =
            await response.json();
        if(data){
            menuData = {
                menu1:{
                    ...menuData.menu1,
                    ...(data.menu1 || {})
                },
                menu2:{
                    ...menuData.menu2,
                    ...(data.menu2 || {})
                },
                menu3:{
                    ...menuData.menu3,
                    ...(data.menu3 || {})
                },
                menu4:{
                    ...menuData.menu4,
                    ...(data.menu4 || {})
                }
            };
            updateMenuNames();
        }
    }catch(error){
        console.log(
            "Firebase gagal:",
            error
        );
    }
    openDefaultMenu();
}
function openDefaultMenu(){
    opened = true;
    radial.classList.add(
        "open"
    );
}
function updateMenuNames(){
    menus.forEach(
        menu=>{
            const index =
                Number(
                    menu.dataset.index
                );
            const key =
                "menu" +
                (index + 1);
            const span =
                menu.querySelector(
                    "span"
                );
            if(menuData[key]){
                span.textContent =
                    menuData[key].title ||
                    (
                        "MENU " +
                        (index + 1)
                    );
            }
        }
    );
}
function getYoutubeEmbed(url){
    if(!url)
        return null;
    try{
        const parsed =
            new URL(url);
        let videoId = null;
        if(
            parsed.hostname.includes(
                "youtu.be"
            )
        ){
            videoId =
                parsed.pathname.substring(1);
        }
        if(
            parsed.hostname.includes(
                "youtube.com"
            )
        ){
            videoId =
                parsed.searchParams.get(
                    "v"
                );
            if(
                !videoId &&
                parsed.pathname.startsWith(
                    "/embed/"
                )
            ){
                videoId =
                    parsed.pathname
                    .split("/embed/")[1];
            }
        }
        if(!videoId)
            return null;
        return (
            "https://www.youtube.com/embed/" +
            videoId +
            "?autoplay=1" +
            "&mute=0" +
            "&playsinline=1" +
            "&rel=0"
        );
    }catch(_){
        return null;
    }
}
let opened = false;
let dragging = false;
let moved = false;
let startAngle = 0;
let currentRotation = 0;
let startRotation = 0;
function getAngle(x,y){
    const rect =
        radial.getBoundingClientRect();
    const cx =
        rect.left +
        rect.width / 2;
    const cy =
        rect.top +
        rect.height / 2;
    return Math.atan2(
        y - cy,
        x - cx
    ) * 180 / Math.PI;
}
function setRotation(angle){
    currentRotation =
        angle;
    layer.style.transform =
        `translate3d(0,0,0) rotate(${angle}deg)`;
    layer.style.setProperty(
        "--rotation",
        `${angle}deg`
    );
}
function getTargetRotation(index){
    const targets = [
        -180,
        -90,
        0,
        -270
    ];
    const baseTarget =
        targets[index];
    const turns =
        Math.round(
            (
                currentRotation -
                baseTarget
            ) / 360
        );
    return (
        baseTarget +
        turns * 360
    );
}
function closeContent(){
    content.classList.remove(
        "show"
    );
    buttons.innerHTML =
        "";
    videoContainer.innerHTML =
        "";
    videoContainer.style.display =
        "none";
    app.classList.remove(
        "menu-open"
    );
}
center.addEventListener(
    "click",
    function(){
        if(moved){
            moved = false;
            return;
        }
        opened =
            !opened;
        radial.classList.toggle(
            "open",
            opened
        );
        if(!opened){
            closeContent();
        }
    }
);
radial.addEventListener(
    "pointerdown",
    function(e){
        if(!opened)
            return;
        if(e.target === center)
            return;
        if(e.target.closest(".menu"))
            return;
        dragging = true;
        moved = false;
        startAngle =
            getAngle(
                e.clientX,
                e.clientY
            );
        startRotation =
            currentRotation;
        radial.classList.add(
            "dragging"
        );
        radial.setPointerCapture(
            e.pointerId
        );
    }
);
radial.addEventListener(
    "pointermove",
    function(e){
        if(!dragging)
            return;
        const angle =
            getAngle(
                e.clientX,
                e.clientY
            );
        let delta =
            angle -
            startAngle;
        if(delta > 180)
            delta -= 360;
        if(delta < -180)
            delta += 360;
        if(
            Math.abs(delta) > 5
        ){
            moved = true;
        }
        setRotation(
            startRotation +
            delta
        );
    }
);
function finishDrag(e){
    if(!dragging)
        return;
    dragging = false;
    radial.classList.remove(
        "dragging"
    );
    const snapped =
        Math.round(
            currentRotation / 90
        ) * 90;
    layer.style.transition =
        "transform .5s cubic-bezier(.2,.85,.3,1.15)";
    setRotation(
        snapped
    );
    try{
        radial.releasePointerCapture(
            e.pointerId
        );
    }catch(_){}
}
radial.addEventListener(
    "pointerup",
    finishDrag
);
radial.addEventListener(
    "pointercancel",
    finishDrag
);
function createButton(
    label,
    url
){
    const button =
        document.createElement(
            "a"
        );
    button.className =
        "link-button";
    button.textContent =
        label;
    button.href =
        url || "#";
    button.target =
        "_blank";
    button.rel =
        "noopener noreferrer";
    return button;
}
function showMenu(index){
    const key =
        "menu" +
        (index + 1);
    const data =
        menuData[key];
    if(!data)
        return;
    menus.forEach(
        menu =>
        menu.classList.remove(
            "active"
        )
    );
    menus[index].classList.add(
        "active"
    );
    const target =
        getTargetRotation(
            index
        );
    layer.style.transition =
        "transform .6s cubic-bezier(.2,.85,.3,1.15)";
    setRotation(
        target
    );
    title.textContent =
        data.title ||
        "KIWOLASU";
    text.textContent =
        data.description ||
        "";
    buttons.innerHTML =
        "";
    videoContainer.innerHTML =
        "";
    videoContainer.style.display =
        "none";
    if(index < 3){
        buttons.appendChild(
            createButton(
                data.title ||
                "BUKA",
                data.url
            )
        );
    }
    if(index === 3){
        const embed =
            getYoutubeEmbed(
                data.url
            );
        if(embed){
            const iframe =
                document.createElement(
                    "iframe"
                );
            iframe.src =
                embed;
            iframe.title =
                data.title ||
                "Tutorial";
            iframe.allow =
                "autoplay; encrypted-media; fullscreen; picture-in-picture";
            iframe.allowFullscreen =
                true;
            videoContainer.appendChild(
                iframe
            );
            videoContainer.style.display =
                "block";
        }else{
            text.textContent =
                "Link video YouTube tidak valid.";
        }
    }
    content.classList.remove(
        "show"
    );
    void content.offsetWidth;
    content.classList.add(
        "show"
    );
    app.classList.add(
        "menu-open"
    );
}
menus.forEach(
    menu=>{
        menu.addEventListener(
            "click",
            function(e){
                e.preventDefault();
                if(moved){
                    moved = false;
                    return;
                }
                const index =
                    Number(
                        menu.dataset.index
                    );
                showMenu(index);
            }
        );
    }
);
close.addEventListener(
    "click",
    closeContent
);
loadFirebase();

</script>
