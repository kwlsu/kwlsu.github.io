<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}
html, body{
    width:100%;
    height:100%;
}
body{
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient( circle at center, #101a29 0%, #05080e 55%, #000 100% );
    font-family:Arial,sans-serif;
    color:white;
    touch-action:none;
}
.app{
    position:relative;
    width:360px;
    height:650px;
    max-width:100vw;
    max-height:100vh;
    overflow:hidden;
}
.content{
    position:absolute;
    left:15px;
    right:15px;
    top:20px;
    min-height:220px;
    max-height:calc(100% - 40px);
    padding:25px;
    border-radius:20px;
    background: linear-gradient( 145deg, rgba(20,35,52,.97), rgba(7,13,21,.97) );
    border:1px solid rgba(80,195,255,.35);
    box-shadow: 0 0 15px rgba(60,180,255,.12), inset 0 0 20px rgba(60,180,255,.03);
    opacity:0;
    transform: translateY(-20px) scale(.97);
    pointer-events:none;
    transition: opacity .35s ease, transform .35s ease;
    overflow:auto;
    scrollbar-width:none;
}
.content::-webkit-scrollbar{
    display:none;
}
.content.show{
    opacity:1;
    transform: translateY(0) scale(1);
    pointer-events:auto;
}
.content h2{
    font-size:22px;
    margin-bottom:8px;
    color:#8de8ff;
    letter-spacing:1px;
}
.content p{
    font-size:14px;
    line-height:1.6;
    color:rgba(255,255,255,.65);
    margin-bottom:18px;
}
.close{
    position:absolute;
    right:14px;
    top:14px;
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.05);
    color:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    z-index:5;
}
.link-button{
    width:100%;
    min-height:48px;
    margin-top:8px;
    border-radius:12px;
    border:1px solid rgba(90,205,255,.4);
    background: linear-gradient( 135deg, rgba(30,65,90,.75), rgba(10,20,30,.9) );
    color:white;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:bold;
    letter-spacing:.5px;
    box-shadow: 0 0 8px rgba(60,190,255,.12);
    transition: transform .2s ease, box-shadow .2s ease;
}
.link-button:active{
    transform:scale(.97);
    box-shadow: 0 0 18px rgba(60,200,255,.35);
}
.download-count{
    display:none;
    margin-top:10px;
    text-align:center;
    font-size:11px;
    letter-spacing:.5px;
    color:rgba(255,255,255,.55);
}
.video-container{
    width:100%;
    aspect-ratio:16 / 9;
    margin-top:10px;
    overflow:hidden;
    border-radius:12px;
    display:none;
    background:#000;
    border:1px solid rgba(80,195,255,.25);
    box-shadow: 0 0 12px rgba(50,180,255,.12);
}
.video-container iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}
.profile-badge{
    position:absolute;
    left:50%;
    top:52px;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    z-index:1;
    pointer-events:none;
    opacity:1;
    transition:opacity .3s ease, transform .3s ease;
}
.app.menu-open .profile-badge{
    opacity:0;
    transform:translateX(-50%) translateY(-10px);
}

.profile-avatar::before{
    content:"";
    position:absolute;
    inset:-7px;
    border-radius:50%;
    border:1px solid rgba(80,195,255,.35);
    animation: kiwo-pulse 2.6s ease-out infinite;
}
@keyframes kiwo-pulse{
    0%{ transform:scale(.9); opacity:.85; }
    70%{ transform:scale(1.3); opacity:0; }
    100%{ opacity:0; }
}
.profile-name{
    font-size:14px;
    font-weight:700;
    letter-spacing:2.5px;
    color:white;
    text-shadow: 0 0 8px rgba(80,195,255,.4);
}
.profile-tier{
    font-size:9.5px;
    color:rgba(255,255,255,.5);
    letter-spacing:1.5px;
    text-transform:uppercase;
}
.radial{
    position:absolute;
    left:50%;
    bottom:15px;
    width:360px;
    height:360px;
    transform: translateX(-50%);
    user-select:none;
    touch-action:none;
}
.rotate-layer{
    position:absolute;
    inset:0;
    transform: translate3d(0,0,0) rotate(0deg);
    transform-origin:center;
    will-change:transform;
    transition: transform .5s cubic-bezier(.2,.85,.3,1.15);
}
.line{
    position:absolute;
    left:50%;
    top:50%;
    width:135px;
    height:1px;
    transform-origin:left center;
    background: linear-gradient( 90deg, rgba(80,205,255,.65), rgba(80,205,255,.05) );
    opacity:0;
    transition: opacity .25s ease;
    pointer-events:none;
}
.line.a2{ transform:rotate(-90deg); }
.line.a1{ transform:rotate(-18deg); }
.line.a0{ transform:rotate(54deg); }
.line.a3{ transform:rotate(126deg); }
.line.a4{ transform:rotate(198deg); }
.radial.open .line{
    opacity:1;
}
.menu{
    position:absolute;
    left:50%;
    top:50%;
    width:68px;
    height:68px;
    margin-left:-34px;
    margin-top:-34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-decoration:none;
    font-size:10px;
    font-weight:bold;
    text-align:center;
    background: radial-gradient( circle, #172537, #0b121c 75% );
    border:1px solid rgba(80,195,255,.55);
    box-shadow: 0 0 8px rgba(50,180,255,.2);
    opacity:0;
    overflow:hidden;
    transform: rotate(var(--a)) translateX(var(--r)) rotate(calc(-1 * var(--a))) scale(.25);
    transition: transform .48s cubic-bezier(.2,.9,.3,1.15), opacity .22s ease;
    will-change:transform;
    pointer-events:none;
}
.menu{ --r:135px; }
.menu[data-index="0"]{ --a:54deg; }
.menu[data-index="1"]{ --a:-18deg; }
.menu[data-index="2"]{ --a:-90deg; }
.menu[data-index="3"]{ --a:126deg; }
.menu[data-index="4"]{ --a:198deg; }
.radial.open .menu{
    opacity:1;
    transform: rotate(var(--a)) translateX(var(--r)) rotate(calc(-1 * var(--a))) scale(1);
    pointer-events:auto;
}
.menu.active{
    border-color: rgba(130,230,255,.95);
    box-shadow: 0 0 12px rgba(70,205,255,.6), 0 0 28px rgba(70,180,255,.25);
}

.menu[data-index="2"]{
    border-color: rgba(170,240,255,.98);
    animation: download-glow 1.8s ease-in-out infinite;
}

@keyframes download-glow{
    0%,100%{
        filter:brightness(.82);
        box-shadow:
            0 0 7px rgba(90,210,255,.35),
            0 0 18px rgba(70,190,255,.18),
            0 0 30px rgba(70,180,255,.08);
    }
    50%{
        filter:brightness(1.45);
        box-shadow:
            0 0 13px rgba(140,235,255,.95),
            0 0 30px rgba(80,215,255,.7),
            0 0 55px rgba(70,190,255,.38);
    }
}
.menu span{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    transform: rotate( calc( -1 * var(--rotation,0deg) ) );
    pointer-events:none;
    white-space:pre-line;
    text-align:center;
    line-height:1.15;
    padding:12px 7px;
    overflow:hidden;
}
.center{
    position:absolute;
    left:50%;
    top:50%;
    width:122px;
    height:122px;
    transform: translate3d(-50%,-50%,0);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    border-radius:50%;
    background: radial-gradient( circle, #172537, #0b121c 70% );
    border: 2px solid rgba(90,205,255,.65);
    color:white;
    font-size:20px;
    font-weight:bold;
    letter-spacing:2px;
    cursor:pointer;
    z-index:20;
    box-shadow: 0 0 12px rgba(60,190,255,.35), 0 0 30px rgba(60,190,255,.08);
    touch-action:manipulation;
    text-decoration:none;
}
.center-label{
    font-size:13px;
    font-weight:800;
    letter-spacing:2px;
    color:#8de8ff;
    text-shadow: 0 0 8px rgba(140,232,255,.6);
}
.center-icon{
    width:44px;
    height:44px;
    color:#8de8ff;
    filter: drop-shadow(0 0 6px rgba(140,232,255,.75));
    transition: transform .4s cubic-bezier(.2,.85,.3,1.15), color .3s ease;
    pointer-events:none;
}
.radial.open .center-icon{
    color:#b5f0ff;
}
.center:active{
    transform: translate3d(-50%,-50%,0) scale(.96);
}
.radial.dragging .rotate-layer{
    transition:none;
}
.radial.dragging .menu{
    transition:none;
}
.page-transition{
    position:fixed;
    inset:0;
    background: radial-gradient( circle at center, #101a29 0%, #05080e 55%, #000 100% );
    opacity:0;
    pointer-events:none;
    transition: opacity .45s ease;
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:center;
}
.page-transition.show{
    opacity:1;
    pointer-events:auto;
}
.page-transition-spinner{
    width:64px;
    height:64px;
    border-radius:50%;
    border:3px solid rgba(90,205,255,.2);
    border-top-color:#8de8ff;
    box-shadow: 0 0 18px rgba(90,205,255,.35);
    opacity:0;
    transition: opacity .3s ease .15s;
    animation: pt-spin .8s linear infinite;
}
.page-transition.show .page-transition-spinner{
    opacity:1;
}
@keyframes pt-spin{
    to{ transform: rotate(360deg); }
}
@media (orientation:portrait){
    .app{
        width:min(360px,100vw);
        height:min(650px,100vh);
    }
    .radial{
        width:360px;
        height:360px;
        bottom:15px;
    }
}
@media (orientation:landscape){
    .app{
        width:100vw;
        height:100vh;
        max-width:none;

    }

        transform: translateY(-50%) translateX(0) scale(1);
    }
    .radial{
        left:auto;
        right:5vw;
        bottom:50%;

        height:300px;
        transform: translateY(50%);
    }
    .line{
        width:110px;
    }
.menu{ --r:110px; }
    .center{
        width:105px;
        height:105px;
        font-size:17px;
        letter-spacing:1.5px;
    }
}
@media (orientation:landscape) and (max-height:420px){
    .content{
        width:48vw;

        min-height:180px;
    }
    .content h2{
        font-size:19px;
    }
    .content p{
        font-size:12px;
        margin-bottom:10px;
    }
    .link-button{
        min-height:40px;
        font-size:12px;
    }
    .radial{
        right:3vw;
        width:250px;
        height:250px;
    }
    .menu{
        width:58px;
        height:58px;
        margin-left:-29px;
        margin-top:-29px;
    }
.menu{ --r:90px; }
    .line{
        width:90px;
    }
    .center{
        width:88px;
        height:88px;
        font-size:14px;
    }
}
@media (orientation:landscape) and (min-width:1000px){
    .app{
        width:100vw;
        height:100vh;
    }
    .content{
        left:6vw;
        top:50%;
        width:min(520px,42vw);
        min-height:240px;
        padding:30px;
        border-radius:24px;
    }
    .content h2{
        font-size:25px;
    }
    .content p{
        font-size:15px;
    }
    .radial{
        right:9vw;
        bottom:50%;
        width:400px;
        height:400px;
        transform: translateY(50%);
    }
    .line{
        width:150px;
    }
    .menu{
        width:76px;
        height:76px;
        margin-left:-38px;
        margin-top:-38px;
        font-size:11px;
    }
.menu{ --r:150px; }
    .center{
        width:130px;
        height:130px;
        font-size:21px;
        letter-spacing:2px;
    }
}
@media (orientation:landscape) and (min-width:1400px){
    .content{
        left:8vw;
        width:min(600px,40vw);
    }
    .radial{
        right:12vw;
    }
}
</style>

<script>const FIREBASE_URL =

async function loadFirebase(){
    try{
        const response =
            await fetch(
                FIREBASE_URL +
                "?t=" +

            );
        if(!response.ok){
            throw new Error(

        if(data){
            menuData = {

function bersihTitle(t){
    return String(t || "")
        .replace(/\\n/g, "\n");
}
function titleSatuBaris(t){
    return bersihTitle(t)
        .replace(/\s*\n\s*/g, " ");
}
function fitMenuText(){
    menus.forEach(
        menu=>{
            const span =
                menu.querySelector("span");
            if(!span) return;
            span.style.fontSize = "";
            span.style.overflowWrap = "";
            const base =
                parseFloat(
                    getComputedStyle(span).fontSize
                );
            const overflow = function(){
                return (
                    span.scrollWidth >
                        span.clientWidth + 0.5 ||
                    span.scrollHeight >
                        span.clientHeight + 0.5
                );
            };
            const shrink = function(floor){
                let size =
                    parseFloat(span.style.fontSize) ||
                    base;
                while(size > floor && overflow()){
                    size -= 0.5;
                    span.style.fontSize =
                        size + "px";
                }
            };
            const softFloor =
                Math.max(base * 0.85, 6);
            /* 1) Bungkus di spasi (hingga 2 baris),
                  font hanya boleh mengecil sedikit */
            shrink(softFloor);
            if(!overflow()) return;
            /* 2) Kata terlalu panjang: pecah jadi
                  2 baris, font kembali ke ukuran besar */
            span.style.overflowWrap = "anywhere";
            span.style.fontSize = "";
            shrink(softFloor);
            /* 3) Pilihan terakhir bila masih tidak muat */
            if(overflow()) shrink(6);
        }
    );
}
function updateMenuNames(){
    menus.forEach(
        menu=>{
            const index =
                Number(
                    menu.dataset.index

            const key =

                    );
            }
        }
    );
}
function getYoutubeEmbed(url){
    if(!url)
        return null;
    try{
        const parsed =
            new URL(url);
        let videoId = null;
        if(
            parsed.hostname.includes(
                "youtu.be"
            )
        ){
            videoId =
                parsed.pathname.substring(1);
        }
        if(
            parsed.hostname.includes(
                "youtube.com"
            )
        ){
            videoId =
                parsed.searchParams.get(
                    "v"
                );
            if(
                !videoId &&
                parsed.pathname.startsWith(
                    "/embed/"
                )
            ){
                videoId =
                    parsed.pathname
                    .split("/embed/")[1];
            }
        }
        if(!videoId)
            return null;
        return (
            "https://www.youtube.com/embed/" +
            videoId +
            "?autoplay=1" +
            "&mute=0" +
            "&playsinline=1" +
            "&rel=0"
        );
    }catch(_){
        return null;
    }
}
let opened = false;
let dragging = false;
let moved = false;
let startAngle = 0;
let currentRotation = 0;
let startRotation = 0;
function getAngle(x,y){
    const rect =
        radial.getBoundingClientRect();
    const cx =
        rect.left +
        rect.width / 2;
    const cy =
        rect.top +
        rect.height / 2;
    return Math.atan2(
        y - cy,
        x - cx
    ) * 180 / Math.PI;
}
function setRotation(angle){
    currentRotation =
        angle;
    layer.style.transform =
        `translate3d(0,0,0) rotate(${angle}deg)`;
    layer.style.setProperty(
        "--rotation",
        `${angle}deg`
    );
}
function getTargetRotation(index){
    const targets = [
        -144,
        -72,
        0,
        -216,
        -288
    ];
    const baseTarget =
        targets[index];
    const turns =
        Math.round(
            (
                currentRotation -
                baseTarget
            ) / 360
        );
    return (
        baseTarget +
        turns * 360
    );
}
function closeContent(){

radial.addEventListener(
    "pointerdown",
    function(e){
        if(!opened)
            return;
        if(e.target === center)
            return;
        if(e.target.closest(".menu"))
            return;
        dragging = true;
        moved = false;
        startAngle =
            getAngle(
                e.clientX,
                e.clientY
            );
        startRotation =
            currentRotation;
        radial.classList.add(
            "dragging"
        );
        radial.setPointerCapture(
            e.pointerId
        );
    }
);
radial.addEventListener(
    "pointermove",
    function(e){
        if(!dragging)
            return;
        const angle =
            getAngle(
                e.clientX,
                e.clientY
            );
        let delta =
            angle -
            startAngle;
        if(delta > 180)
            delta -= 360;
        if(delta < -180)
            delta += 360;
        if(
            Math.abs(delta) > 5
        ){
            moved = true;
        }
        setRotation(
            startRotation +
            delta
        );
    }
);
function finishDrag(e){
    if(!dragging)
        return;
    dragging = false;
    radial.classList.remove(
        "dragging"
    );
    const snapped =
        Math.round(
            currentRotation / 72
        ) * 72;
    layer.style.transition =
        "transform .5s cubic-bezier(.2,.85,.3,1.15)";
    setRotation(
        snapped
    );
    try{
        radial.releasePointerCapture(
            e.pointerId
        );
    }catch(_){}
}
radial.addEventListener(
    "pointerup",
    finishDrag
);
radial.addEventListener(
    "pointercancel",
    finishDrag

async function getVisitorInfo(){
    const ua =
        navigator.userAgent || "";

    const info = {
        userAgent: ua,
        platform:
            navigator.platform ||
            "",
        language:
            navigator.language ||
            "",
        screen:
            window.screen.width +
            "x" +
            window.screen.height,
        timezone:
            (
                Intl.DateTimeFormat()
                    .resolvedOptions()
                    .timeZone
            ) || "",
        deviceModel: "",
        androidVersion: ""
    };

    /*
     * Android version dari User-Agent.
     * Contoh:
     * Linux; Android 10; Redmi Note 9 Build/...
     */
    const androidMatch =
        ua.match(/Android[\s/]+([0-9.]+)/i);

    if(androidMatch){
        info.androidVersion =
            androidMatch[1] || "";

        /*
         * Model biasanya berada sebelum " Build/..."
         */
        const modelMatch =
            ua.match(/Android[^;)]*;\s*([^;)]+?)\s+Build\//i);

        if(modelMatch){
            info.deviceModel =
                modelMatch[1]
                    .replace(/^wv;\s*/i, "")
                    .trim();
        }

        /*
         * Fallback bila pola Build tidak ditemukan.
         */
        if(!info.deviceModel){
            const parts =
                ua.split(";").map(x => x.trim());

            const androidIndex =
                parts.findIndex(x =>
                    /^Android[\s/]/i.test(x)
                );

            if(
                androidIndex >= 0 &&
                parts[androidIndex + 1]
            ){
                info.deviceModel =
                    parts[androidIndex + 1]
                        .replace(/\s+Build\/.*$/i, "")
                        .trim();
            }
        }
    }

    /*
     * User-Agent Client Hints, bila browser mendukung.
     * Tidak semua browser mengizinkan model perangkat.
     */
    try{
        if(
            navigator.userAgentData &&
            navigator.userAgentData.getHighEntropyValues
        ){
            const hints =
                await navigator.userAgentData
                    .getHighEntropyValues([
                        "model",
                        "platform",
                        "platformVersion"
                    ]);

            if(hints.platform){
                info.platform =
                    hints.platform;
            }

            if(hints.platform === "Android" && hints.platformVersion){
                info.androidVersion =
                    hints.platformVersion;
            }

            if(hints.model){
                info.deviceModel =
                    hints.model;
            }
        }
    }catch(_){}

    try{
        const res =
            await fetch(
                "https://api.ipify.org?format=json"
            );

        if(res.ok){
            const ipData =
                await res.json();

            info.ip =
                ipData.ip || "";
        }
    }catch(err){
        info.ip = "";
    }

    return info;
}
function tampilDownloadCount(){
    const el =
        document.getElementById("downloadCount");
    if(!el) return;
    if(downloadTotal === null){
        el.textContent = "";
        return;
    }
    el.textContent =
        "📥 " +
        downloadTotal.toLocaleString("id-ID") +
        " pengunduh";
}
async function loadDownloadCount(){
    try{
        const res =
            await fetch(
                DOWNLOAD_COUNT_URL +
                "?t=" +
                Date.now()
            );
        if(!res.ok){
            throw new Error(
                "HTTP " + res.status
            );
        }
        const val =
            await res.json();
        downloadTotal =
            DOWNLOAD_AWAL + (Number(val) || 0);
        tampilDownloadCount();
    }catch(err){
        console.log(
            "Gagal memuat jumlah pengunduh:",
            err
        );
    }
}
function tambahDownloadCount(){
    try{
        fetch(DOWNLOAD_COUNT_URL,{
            method:"PUT",
            headers:{
                "Content-Type":
                    "application/json"
            },
            body:
                JSON.stringify({
                    ".sv":{
                        increment:1
                    }
                }),
            keepalive:true
        }).then(function(res){
            if(res.ok){
                downloadTotal =
                    (downloadTotal === null
                        ? DOWNLOAD_AWAL
                        : downloadTotal) + 1;
                tampilDownloadCount();
            }
        }).catch(function(err){
            console.log(
                "Gagal menambah pengunduh:",
                err
            );
        });
    }catch(err){
        console.log(
            "Gagal menambah pengunduh:",
            err
        );
    }
}
async function catatKlik(menuKey){
    const payload = {
        menu:menuKey,
        waktu:Date.now()
    };
    if(menuKey === "menu3"){
        try{
            const visitorInfo =
                await getVisitorInfo();
            payload.ip =
                visitorInfo.ip;
            payload.userAgent =
                visitorInfo.userAgent;
            payload.platform =
                visitorInfo.platform;
            payload.deviceModel =
                visitorInfo.deviceModel;
            payload.androidVersion =
                visitorInfo.androidVersion;
            payload.language =
                visitorInfo.language;
            payload.screen =
                visitorInfo.screen;
            payload.timezone =
                visitorInfo.timezone;
        }catch(err){
            console.log(
                "Gagal mengambil info visitor:",
                err
            );
        }
    }
    try{
        fetch(KLIK_URL,{
            method:"POST",
            headers:{
                "Content-Type":
                    "application/json"
            },
            body:
                JSON.stringify(
                    payload
                ),
            keepalive:true
        }).catch(function(err){
            console.log(
                "Gagal mencatat klik:",
                err
            );
        });
    }catch(err){
        console.log(
            "Gagal mencatat klik:",
            err
        );
    }
}
function createButton(
    label,
    url,
    menuKey
){
    const button =
        document.createElement(
            "a"
        );
    button.className =
        "link-button";
    button.textContent =
        label;
    button.href =
        url || "#";
    button.target =
        "_blank";
    button.rel =
        "noopener noreferrer";
    button.addEventListener(
        "click",
        function(){
            if(menuKey === "menu3"){
                tambahDownloadCount();
            }
            catatKlik(
                menuKey
            );
        }
    );
    return button;
}
function showMenu(index){
    const key =
        "menu" +
        (index + 1);
    const data =
        menuData[key];
    if(!data)
        return;
    menus.forEach(
        menu =>
        menu.classList.remove(

    menus[index].classList.add(

    const target =

        );
    layer.style.transition =
        "transform .6s cubic-bezier(.2,.85,.3,1.15)";
    setRotation(
        target
    );
    title.textContent =
        titleSatuBaris(data.title) ||

        "";
    buttons.innerHTML =
        "";

        "";

        "none";
    const countEl =
        document.getElementById("downloadCount");
    if(index === 2){
        countEl.style.display = "block";
        tampilDownloadCount();

    }else{
        countEl.style.display = "none";
    }
    if(index !== 3){
        buttons.appendChild(
            createButton(
                titleSatuBaris(data.title) ||
                "BUKA",
                data.url,
                key
            )
        );
    }
    if(index === 3){
        const embed =
            getYoutubeEmbed(
                data.url
            );
        if(embed){
            const iframe =
                document.createElement(
                    "iframe"
                );
            iframe.src =
                embed;
            iframe.title =
                data.title ||
                "Tutorial";
            iframe.allow =
                "autoplay; encrypted-media; fullscreen; picture-in-picture";
            iframe.allowFullscreen =
                true;
            videoContainer.appendChild(
                iframe
            );
            videoContainer.style.display =
                "block";
        }else{
            text.textContent =
                "Link video YouTube tidak valid.";
        }
    }
    content.classList.remove(
        "show"
    );
    void content.offsetWidth;
    content.classList.add(
        "show"
    );
    app.classList.add(
        "menu-open"
    );
}
